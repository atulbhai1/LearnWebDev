<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    .grid{
      display: grid;
      gap: 9px;
      background-color: black;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
    }
    .bigRed{
      grid-column: span 1;
      grid-row: span 1;
      background-color: #E72F24;
    }
    .topRightWhite{
      grid-area: 1/2/2/-1;
      background-color: #F0F1EC;
    }
    .middleLeftWhite{
      grid-area: 2/1/4/2;
      background-color: #F0F1EC;
    }
    .bottomLeftWhite{
      grid-area: 4/1/5/2;
      background-color: #F0F1EC;
    }
    .bottomRightBigWhite{
      grid-area: 2/2/4/4;
      background-color: #F0F1EC;
    }
    .bottomRightLittleWhite{
      grid-area: -3/-2/-1/-1;
      background-color: #F0F1EC;
    }
    .nblue{
      grid-area: -4/-2/-3/-1;
      background-color: #004592;
      border-width: 0px 0px 10px 0px;
      border-style: solid;
      border-color: black;
    }
    .nyellow{
      grid-area: -2/-4/-1/-3;
      background-color: #F9D01E;

    }
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
  </style>
</head>

<body>
  <!-- Write your HTML here -->
<div class="grid">
  <div class="bigRed"></div>
  <div class="topRightWhite"></div>
  <div class="middleLeftWhite"></div>
  <div class="bottomLeftWhite"></div>
  <div class="bottomRightBigWhite"></div>
  <div class="bottomRightLittleWhite"></div>
  <div class="nblue"></div>
  <div class="nyellow"></div>
</div>
</body>

</html>
