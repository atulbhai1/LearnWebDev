<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>How to make toast</h1>
<h2>Ingredients</h2>
<h3>For the bread:</h3>
<ul>
    <li>1 Slice of bread</li>
    <li>1 Tablespoon of butter</li>
    <li>Jam(If desired)</li>
</ul>
<h3>For Preparation:</h3>
<ul>
    <li>Toaster</li>
    <li>Knife</li>
</ul>
<h2>
    Instructions
</h2>
<ol>
    <li>Toast bread in toaster</li>
    <li>Take bread out</li>
    <li>Spread butter and jam</li>
    <li>Enjoy!</li>
</ol>
</body>
</html>
